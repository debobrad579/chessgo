services:
  server:
    image: ghcr.io/debobrad579/chessgo:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    environment:
      PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-chessgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-chessgo}
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET is required}
      APP_ORIGIN: https://app.chessgo.ca
      WWW_ORIGIN: https://www.chessgo.ca
    networks:
      - database
      - metrics
      - public

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chessgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-chessgo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chessgo} -d ${POSTGRES_DB:-chessgo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - database
  migrate:
    image: ghcr.io/kukymbr/goose-docker:3.24.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=db port=5432 user=${POSTGRES_USER:-chessgo} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-chessgo} sslmode=disable"
    volumes:
      - ./sql/schema:/migrations
    command: ["up"]
    networks:
      - database

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - metrics
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    networks:
      - metrics
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - metrics

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks:
      - public
    profiles:
      - cloudflare

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  database:
  metrics:
  public:
